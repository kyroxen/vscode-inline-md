name: Build & quality

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.13.2). Leave empty to use the latest tag.'
        required: false
        type: string

jobs:
  crlf-tests:
    name: CRLF Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [lts/*]
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Test CRLF
        run: npm run test:crlf --if-present

  ci:
    # CI runs on all pushes (branches and tags) and pull requests
    # This ensures releases only happen if all tests pass
    name: CI Build & Test
    runs-on: ubuntu-latest
    needs: crlf-tests
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [lts/*, current]
      fail-fast: false  # Continue running other matrix jobs even if one fails
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For tag pushes, checkout the tag; for branches/PRs, checkout the commit
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Validate feature file outlines
        run: npm run lint:docs --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test --if-present
      - name: Start Xvfb
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 1
      - name: E2E tests
        env:
          DISPLAY: ':99'
        run: npm run test:e2e

  # The "cd-release" job creates a GitHub Release and uploads the extension as an asset
  cd-release:
    # Only runs when the push references a tag that starts with "v" (for example: refs/tags/v1.2.3) or on workflow_dispatch
    # Requires ci job to pass first to ensure code quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use Node.js with the npmjs.org registry
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      - name: Clean
        run: npm run clean
      - name: Build
        run: npm run build
      - name: Verify build artifact
        run: |
          if [ ! -f dist/extension.vsix ]; then
            echo "Error: dist/extension.vsix not found after build"
            exit 1
          fi
          echo "Build artifact verified: $(ls -lh dist/extension.vsix)"
      - name: Extract version from tag
        id: tag_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              # If no tag provided, get the latest tag
              TAG=$(git describe --tags --abbrev=0)
            fi
            VERSION=${TAG#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/extension.vsix
          tag_name: ${{ steps.tag_version.outputs.TAG }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
